<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>American Odds for Novig</title>
<style>
  :root {
    --bg: #0f1319;
    --panel: #171c24;
    --text: #eef2f7;
    --muted: #93a1b3;
    --line: #262d38;
    --accent: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    width: 288px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; font-size: 11.5px; color: var(--muted); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
  }
  .row-label { font-weight: 600; }
  .row-sub { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 26px; flex: 0 0 auto; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .track {
    position: absolute; inset: 0;
    background: #333c49; border-radius: 999px;
    transition: background 140ms ease;
    pointer-events: none;
  }
  .thumb {
    position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff;
    transition: transform 140ms ease;
    pointer-events: none;
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .thumb { transform: translateX(18px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .legend {
    margin: 0 16px 14px;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .legend h2 { margin: 0 0 8px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 2px 0; font-size: 12px; }
  td:last-child { text-align: right; color: var(--accent); font-weight: 600; }
  footer { padding: 0 16px 14px; font-size: 11px; color: var(--muted); }
  footer a { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1>American Odds for Novig</h1>
    <p>Adds American odds beside every probability on novig.com.</p>
  </header>

  <div class="row">
    <div>
      <div class="row-label">Show American odds</div>
      <div class="row-sub" id="status">Loading…</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" aria-label="Show American odds" />
      <span class="track"></span>
      <span class="thumb"></span>
    </label>
  </div>

  <div class="legend">
    <h2>How it converts</h2>
    <table>
      <tr><td>25%</td><td>+300</td></tr>
      <tr><td>44%</td><td>+127</td></tr>
      <tr><td>50%</td><td>-100</td></tr>
      <tr><td>57%</td><td>-133</td></tr>
      <tr><td>75%</td><td>-300</td></tr>
    </table>
  </div>

  <footer>
    Reading only. Nothing is collected, stored off-device, or sent anywhere.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
